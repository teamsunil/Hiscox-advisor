<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Insurance Advisor — Hiscox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D;
    --paper:#F3F1EA;
    --panel:#FFFFFF;
    --red:#D8281B;
    --red-dark:#AD1F15;
    --slate:#6B6D72;
    --pine:#2F6E5B;
    --pine-bg:#E7EFEA;
    --amber:#9A6A16;
    --amber-bg:#F5EBD9;
    --line: rgba(27,27,29,0.12);
    --bg: var(--paper);
    --text: var(--ink);
    --text-muted: var(--slate);
    --surface: var(--panel);
    --surface-2: #EAE6DC;
    --surface-3: #F9F8F5;
    --bubble-user: var(--ink);
    --bubble-user-text: #F7F6F3;
    --bubble-bot: #FFFFFF;
    --bubble-bot-text: var(--ink);
    --shadow: 0 1px 2px rgba(20,18,14,0.04), 0 10px 30px -12px rgba(20,18,14,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121113;
      --text:#EFEDE7;
      --text-muted:#A6A29B;
      --surface:#1B1A1C;
      --surface-2:#242226;
      --surface-3:#1F1E20;
      --line: rgba(255,255,255,0.12);
      --bubble-user: var(--red);
      --bubble-user-text:#fff;
      --bubble-bot:#201F21;
      --bubble-bot-text:#EFEDE7;
      --pine-bg:#16241E;
      --amber-bg:#2A2115;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121113;
    --text:#EFEDE7;
    --text-muted:#A6A29B;
    --surface:#1B1A1C;
    --surface-2:#242226;
    --surface-3:#1F1E20;
    --line: rgba(255,255,255,0.12);
    --bubble-user: var(--red);
    --bubble-user-text:#fff;
    --bubble-bot:#201F21;
    --bubble-bot-text:#EFEDE7;
    --pine-bg:#16241E;
    --amber-bg:#2A2115;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -12px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 22px;
    background: var(--ink);
    color:#F7F6F3;
    border-bottom: 3px solid var(--red);
    flex-shrink:0;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .logo-chip{
    background:#FFFFFF; border-radius:9px; padding:7px 12px; display:flex; align-items:center;
    flex-shrink:0; box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .logo-chip img{ display:block; height:24px; width:auto; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-tagline{ font-size:12.5px; color:#C9C6C0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:#59C88A; margin-right:6px; box-shadow:0 0 0 0 rgba(89,200,138,.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(89,200,138,.55); }
    70%{ box-shadow:0 0 0 6px rgba(89,200,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(89,200,138,0); }
  }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .ghost-btn{
    background:transparent; color:#F0EEE9; border:1px solid rgba(255,255,255,0.28);
    padding:8px 14px; border-radius:100px; font-size:13px; font-weight:500;
    cursor:pointer; transition: background .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  .ghost-btn:hover{ background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.5); }
  .ghost-btn.summary-toggle{ display:none; }

  /* ---------- Layout ---------- */
  .layout{ flex:1; display:flex; min-height:0; }
  .chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); position:relative; }

  .chat-scroll{
    flex:1; overflow-y:auto; padding: 26px 0 14px;
    scroll-behavior:smooth;
  }
  .chat-inner{ max-width:720px; margin:0 auto; padding: 0 24px; display:flex; flex-direction:column; gap:18px; }

  .row{ display:flex; gap:10px; align-items:flex-end; max-width:100%; }
  .row.bot{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }

  .avatar-sm{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background: var(--ink); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .avatar-sm svg{ width:18px; height:18px; }

  .bubble{
    padding:13px 16px; border-radius:16px; font-size:15px; line-height:1.55;
    max-width: 78%; box-shadow: var(--shadow); word-wrap:break-word;
  }
  .row.bot .bubble{
    background:var(--bubble-bot); color:var(--bubble-bot-text);
    border-bottom-left-radius:4px;
  }
  .row.user .bubble{
    background:var(--bubble-user); color:var(--bubble-user-text);
    border-bottom-right-radius:4px;
  }
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble ul{ margin:6px 0; padding-left:20px; }
  .bubble li{ margin:3px 0; }

  .typing-row .bubble{ padding:14px 18px; }
  .typing-dots{ display:flex; gap:4px; align-items:center; height:14px; }
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background: var(--text-muted); opacity:.5;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-4px); opacity:1;} }

  /* recommendation card */
  .rec-card{
    background:var(--surface-3); border:1px solid var(--line); border-radius:14px;
    padding:16px 17px; margin-top:2px;
  }
  .rec-title{
    font-family:'Fraunces', Georgia, serif; font-size:15.5px; font-weight:600;
    margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  .rec-title .bar{ width:4px; height:16px; background:var(--red); border-radius:2px; display:inline-block; }
  .rec-block{ margin-bottom:12px; }
  .rec-block:last-child{ margin-bottom:0; }
  .rec-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:5px 10px;
    border-radius:100px; background:var(--pine-bg); color:var(--pine); font-weight:500; border:1px solid transparent;
  }
  .chip.warn{ background:var(--amber-bg); color:var(--amber); }
  .coverage-item{ padding:9px 0; border-top:1px solid var(--line); }
  .coverage-item:first-child{ border-top:none; padding-top:0; }
  .coverage-name{ font-weight:600; font-size:14px; margin-bottom:2px; }
  .coverage-why{ font-size:13px; color:var(--text-muted); line-height:1.5; }

  .action-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .action-btn{
    font-family:inherit; font-size:13px; font-weight:600; padding:9px 14px; border-radius:9px;
    cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--text);
    transition: transform .1s ease, border-color .15s ease;
  }
  .action-btn:hover{ border-color:var(--text-muted); }
  .action-btn:active{ transform: scale(0.97); }
  .action-btn.primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .action-btn.primary:hover{ background:var(--red-dark); border-color:var(--red-dark); }

  .disclaimer{ font-size:11.5px; color:var(--text-muted); margin-top:12px; line-height:1.5; }

  /* ---------- Composer ---------- */
  .composer-wrap{ padding: 12px 24px 20px; flex-shrink:0; background: var(--bg); }
  .composer{
    max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:8px 8px 8px 16px; box-shadow: var(--shadow);
  }
  .composer textarea{
    flex:1; border:none; outline:none; resize:none; background:transparent; color:var(--text);
    font-family:inherit; font-size:15px; line-height:1.5; max-height:140px; padding:8px 0;
  }
  .composer textarea::placeholder{ color:var(--text-muted); }
  .send-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition: background .15s ease, transform .1s ease;
  }
  .send-btn:hover{ background:var(--red); }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:.4; cursor:default; }
  .composer-hint{ max-width:720px; margin:8px auto 0; font-size:11.5px; color:var(--text-muted); text-align:center; }

  /* ---------- Summary panel ---------- */
  .summary-col{
    width:320px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .summary-header{ padding:20px 20px 10px; flex-shrink:0; }
  .summary-header h2{
    font-family:'Fraunces', Georgia, serif; font-size:16px; margin:0 0 3px; font-weight:600;
  }
  .summary-header p{ margin:0; font-size:12.5px; color:var(--text-muted); }
  .summary-body{ flex:1; overflow-y:auto; padding: 6px 20px 24px; }
  .sblock{ margin-bottom:20px; }
  .sblock-title{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:600; margin-bottom:9px; }
  .sblock-empty{ font-size:13px; color:var(--text-muted); font-style:italic; line-height:1.5; }
  .fact-line{ font-size:13.5px; margin-bottom:6px; display:flex; gap:8px; line-height:1.45; }
  .fact-line .dot{ width:5px; height:5px; border-radius:50%; background:var(--red); margin-top:7px; flex-shrink:0; }
  .area-card{
    border:1px solid var(--line); border-radius:10px; padding:10px 11px; margin-bottom:8px; background:var(--surface-3);
  }
  .area-card .name{ font-size:13.5px; font-weight:600; margin-bottom:2px; }
  .area-card .status{ font-size:11.5px; color:var(--pine); font-weight:500; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,14,12,0.55); backdrop-filter: blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--surface); border-radius:18px; max-width:520px; width:100%;
    max-height:85vh; overflow-y:auto; padding:28px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.45);
    position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface-3); color:var(--text); cursor:pointer;
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .modal h3{ font-family:'Fraunces', Georgia, serif; font-size:21px; margin:0 0 4px; padding-right:30px; }
  .modal .sub{ color:var(--text-muted); font-size:13.5px; margin-bottom:18px; }
  .modal .ref{
    display:inline-block; font-family:'Inter',monospace; background:var(--surface-2); padding:6px 12px;
    border-radius:8px; font-size:13px; margin-bottom:16px; letter-spacing:.03em;
  }
  .modal-cov-grid{ display:flex; flex-direction:column; gap:10px; }
  .modal-cov-item{ border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
  .modal-cov-item .n{ font-weight:600; font-size:14.5px; margin-bottom:3px; display:flex; align-items:center; gap:8px; }
  .modal-cov-item .d{ font-size:13px; color:var(--text-muted); line-height:1.5; }
  .badge-relevant{
    font-size:10.5px; background:var(--pine-bg); color:var(--pine); padding:2px 8px; border-radius:100px;
    font-weight:600; letter-spacing:.02em;
  }
  .modal-steps{ margin:14px 0 0; padding-left:18px; }
  .modal-steps li{ font-size:13.5px; margin-bottom:6px; color:var(--text); line-height:1.5; }
  .modal-note{ font-size:12px; color:var(--text-muted); margin-top:18px; padding-top:14px; border-top:1px solid var(--line); line-height:1.6; }
  .connecting-wrap{ text-align:center; padding: 10px 0 4px; }
  .connecting-ring{
    width:56px; height:56px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--red);
    margin:0 auto 18px; animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Scrollbars ---------- */
  .chat-scroll::-webkit-scrollbar, .summary-body::-webkit-scrollbar, .modal::-webkit-scrollbar{ width:8px; }
  .chat-scroll::-webkit-scrollbar-thumb, .summary-body::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb{
    background: var(--line); border-radius:8px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 880px){
    .summary-col{
      position:fixed; top:0; right:0; bottom:0; width:min(340px,88vw); z-index:40;
      transform: translateX(100%); transition: transform .25s ease; box-shadow: -12px 0 30px rgba(0,0,0,0.2);
    }
    .summary-col.open{ transform: translateX(0); }
    .ghost-btn.summary-toggle{ display:inline-block; }
    .bubble{ max-width:86%; }
    .brand-tagline{ display:none; }
  }
  @media (max-width: 520px){
    .topbar{ padding:12px 14px; }
    .chat-inner{ padding:0 14px; }
    .composer-wrap{ padding:10px 14px 16px; }
  }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
</style>
</head>

  var SUMMARY_RE = /\b(recommend|what should i (get|do|consider)|based on (what|everything)|what do you think i need|summar(y|ise|ize)|what have we covered|what('?s| is) relevant (to|for) me)\b/i;
  var NEGATIVE_RE = /\b(no|not really|nope|none)\b/i;

  /* =========================================================
     STATE
  ========================================================== */
  function freshContext(){
    return {
      turns: 0,
      statementTurns: 0,
      businessType: null,
      isBusinessSignal: false,
      isPersonalSignal: false,
      employees: null,
      concerns: [],       // array of {label}
      dataTypes: [],
      assets: [],
      lastArea: null,
      coverage: {},        // area -> {score, askedIdx, factCount}
      shownAreaSnapshot: [],
      recommendationCount: 0,
      handoffOffered: false,
      lastFallbackIdx: -1
    };
  }
  var ctx = freshContext();
  var isBotTyping = false;

  /* =========================================================
     DOM refs
  ========================================================== */
  var chatInner = document.getElementById("chatInner");
  var chatScroll = document.getElementById("chatScroll");
  var userInput = document.getElementById("userInput");
  var sendBtn = document.getElementById("sendBtn");
  var summaryBody = document.getElementById("summaryBody");
  var summaryCol = document.getElementById("summaryCol");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalCard = document.getElementById("modalCard");

  function scrollToBottom(){
    requestAnimationFrame(function(){ chatScroll.scrollTop = chatScroll.scrollHeight + 999; });
  }

  /* =========================================================
     ANALYSIS
  ========================================================== */
  function ensureAreaState(area){
    if(!ctx.coverage[area]) ctx.coverage[area] = { score:0, askedIdx:0, factCount:0 };
    return ctx.coverage[area];
  }

  function analyze(text){
    var lower = text.toLowerCase();
    var newFacts = [];   // human-readable strings of what we just learned
    var touchedAreas = {}; // area -> true if this message added signal

    // business type
    if(!ctx.businessType){
      for(var i=0;i<BUSINESS_TYPES.length;i++){
        if(BUSINESS_TYPES[i][1].test(text)){
          ctx.businessType = BUSINESS_TYPES[i][0];
          newFacts.push("business type: " + BUSINESS_TYPES[i][0]);
          ctx.isBusinessSignal = true;
          break;
        }
      }
    }
    if(/\b(my business|my company|our company|our business|my startup|our startup|i run a|we run a|i own a|we sell|my clients|our clients|my employees|our employees)\b/i.test(text)){
      ctx.isBusinessSignal = true;
    }
    if(/\b(my home|my house|my family|for myself|personally|my personal|my holiday|my trip|my car\b)\b/i.test(text)){
      ctx.isPersonalSignal = true;
    }

    // employees
    var em = text.match(EMPLOYEE_RE);
    if(em && !ctx.employees){
      ctx.employees = em[1];
      newFacts.push("team size: " + em[1]);
      ctx.isBusinessSignal = true;
    }

    // concerns
    CONCERN_PATTERNS.forEach(function(p){
      if(p[1].test(text) && ctx.concerns.indexOf(p[0]) === -1){
        ctx.concerns.push(p[0]);
        newFacts.push("concern: " + p[0]);
      }
    });

    // data types
    DATA_PATTERNS.forEach(function(p){
      if(p[1].test(text) && ctx.dataTypes.indexOf(p[0]) === -1){
        ctx.dataTypes.push(p[0]);
        newFacts.push("data: " + p[0]);
      }
    });

    // assets
    ASSET_PATTERNS.forEach(function(p){
      if(p[1].test(text) && ctx.assets.indexOf(p[0]) === -1){
        ctx.assets.push(p[0]);
        newFacts.push("asset: " + p[0]);
      }
    });

    // coverage area scoring via keywords
    AREA_ORDER.forEach(function(area){
      var kb = KB[area];
      var hit = false;
      if(kb.explicit.test(text)) hit = true;
      if(!hit){
        for(var k=0;k<kb.keywords.length;k++){
          if(lower.indexOf(kb.keywords[k].toLowerCase()) !== -1){ hit = true; break; }
        }
      }
      if(hit){
        var st = ensureAreaState(area);
        var wasZero = st.score === 0;
        st.score += 1;
        st.factCount += 1;
        touchedAreas[area] = true;
        if(wasZero) newFacts.push("area: " + area);
      }
    });

    return { newFacts: newFacts, touchedAreas: Object.keys(touchedAreas) };
  }

  function detectIntent(text){
    if(HANDOFF_RE.test(text)) return "handoff";
    if(SUMMARY_RE.test(text)) return "summary";
    if(GREETING_RE.test(text) && ctx.turns <= 1) return "greeting";
    if(COST_RE.test(text)) return "cost";
    if(COVQ_RE.test(text)) return "covq";
    if(THANKS_RE.test(text) && text.trim().split(/\s+/).length < 6) return "thanks";
    return "statement";
  }

  function pickExplicitArea(text){
    for(var i=0;i<AREA_ORDER.length;i++){
      if(KB[AREA_ORDER[i]].explicit.test(text)) return AREA_ORDER[i];
    }
    // fall back to keyword score in this message
    var best = null, bestScore = 0;
    AREA_ORDER.forEach(function(area){
      var lower = text.toLowerCase();
      var s = 0;
      KB[area].keywords.forEach(function(k){ if(lower.indexOf(k.toLowerCase())!==-1) s++; });
      if(s > bestScore){ bestScore = s; best = area; }
    });
    return best;
  }

  function confirmedAreas(){
    return AREA_ORDER.filter(function(a){ return ctx.coverage[a] && ctx.coverage[a].score > 0; });
  }

  function totalFactSignals(){
    var n = 0;
    if(ctx.businessType) n++;
    if(ctx.employees) n++;
    n += ctx.concerns.length;
    n += ctx.dataTypes.length;
    n += ctx.assets.length;
    return n;
  }

  /* =========================================================
     RESPONSE GENERATION
  ========================================================== */
  var ACK_STARTERS = [
    "Got it.", "Understood.", "That's helpful context.", "Thanks for sharing that.", "Okay, that helps."
  ];
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function subjectPhrase(){
    if(ctx.businessType) return "your " + ctx.businessType + " business";
    if(ctx.isBusinessSignal) return "your business";
    if(ctx.isPersonalSignal) return "your situation";
    return "what you've described";
  }

  function describeArea(area){ return KB[area].name; }

  function buildAckSentence(newFacts, touchedAreas){
    var bits = [];
    if(ctx.businessType && newFacts.indexOf("business type: " + ctx.businessType) !== -1){
      bits.push("running a " + ctx.businessType + " business");
    }
    var newConcerns = newFacts.filter(function(f){ return f.indexOf("concern:") === 0; }).map(function(f){ return f.slice(9); });
    if(newConcerns.length){ bits.push("being concerned about " + newConcerns.join(" and ")); }
    var newData = newFacts.filter(function(f){ return f.indexOf("data:") === 0; }).map(function(f){ return f.slice(6); });
    if(newData.length){ bits.push("handling " + newData.join(" and ")); }
    var newAssets = newFacts.filter(function(f){ return f.indexOf("asset:") === 0; }).map(function(f){ return f.slice(7); });
    if(newAssets.length){ bits.push("having " + newAssets.join(" and ")); }

    if(bits.length === 0) return null;
    return pick(ACK_STARTERS) + " I've noted " + bits.join(", and ") + ".";
  }

  function nextFollowUpFor(area){
    var st = ensureAreaState(area);
    var kb = KB[area];
    if(st.askedIdx < kb.followUps.length){
      var q = kb.followUps[st.askedIdx];
      st.askedIdx++;
      return q;
    }
    return null;
  }

  function generalOpenQuestions(){
    return [
      "Could you tell me a bit more — is this mainly about a business, your home, or something more personal like travel or valuables?",
      "What's prompting you to think about cover right now? A specific worry, an upcoming change, or just general planning?",
      "No problem — whenever you're ready, tell me a little about what you're trying to protect, and I'll help you think it through."
    ];
  }

  function fallbackResponse(){
    var options = [
      "I mostly focus on insurance and risk, so I'm not certain how that connects to your cover — could you tell me more about your business or personal situation, and what's on your mind?",
      "I want to make sure I point you in the right direction. Could you say a bit more about what you're trying to protect — a business, your home, travel, valuables?",
      "Let's bring that back to your situation — what's the context here? A business you run, your home, or something else you'd like to think through cover for?"
    ];
    ctx.lastFallbackIdx = (ctx.lastFallbackIdx + 1) % options.length;
    return options[ctx.lastFallbackIdx];
  }

  function riskLabelFor(concern){ return concern.charAt(0).toUpperCase() + concern.slice(1); }

  function buildRecommendationHTML(){
    var areas = confirmedAreas();
    var html = '<div class="rec-card">';
    html += '<div class="rec-title"><span class="bar"></span>Based on our conversation</div>';

    // context block
    var ctxBits = [];
    if(ctx.businessType) ctxBits.push("A " + ctx.businessType + " business" + (ctx.employees ? (" with around " + ctx.employees + " people") : ""));
    else if(ctx.isBusinessSignal) ctxBits.push("A business" + (ctx.employees ? (" with around " + ctx.employees + " people") : ""));
    if(ctx.isPersonalSignal && !ctx.isBusinessSignal) ctxBits.push("A personal / individual situation");
    if(ctx.dataTypes.length) ctxBits.push("Handles " + ctx.dataTypes.join(", "));
    if(ctx.assets.length) ctxBits.push("Assets mentioned: " + ctx.assets.join(", "));
    if(ctxBits.length){
      html += '<div class="rec-block"><div class="rec-label">Context</div><div class="chip-row">';
      ctxBits.forEach(function(b){ html += '<span class="chip">' + esc(b) + '</span>'; });
      html += '</div></div>';
    }

    // risks
    if(ctx.concerns.length){
      html += '<div class="rec-block"><div class="rec-label">Key risks identified</div><div class="chip-row">';
      ctx.concerns.forEach(function(c){ html += '<span class="chip warn">' + esc(riskLabelFor(c)) + '</span>'; });
      html += '</div></div>';
    }

    // coverage areas
    if(areas.length){
      html += '<div class="rec-block"><div class="rec-label">Potentially relevant coverage</div>';
      areas.forEach(function(area){
        html += '<div class="coverage-item"><div class="coverage-name">' + esc(KB[area].name) + '</div>';
        html += '<div class="coverage-why">' + esc(whyRelevant(area)) + '</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="action-row">';
    html += '<button class="action-btn primary" data-action="quote">Get a Quote</button>';
    html += '<button class="action-btn" data-action="explore">Explore Coverage</button>';
    html += '<button class="action-btn" data-action="speak">Speak to a Specialist</button>';
    html += '</div>';
    html += '<div class="disclaimer">This is general guidance based on what you\'ve shared, not a policy recommendation, eligibility decision or quote. Coverage areas are worth exploring further with a specialist.</div>';
    html += '</div>';
    return html;
  }

  function whyRelevant(area){
    var reasons = [];
    if(area === "cyber"){
      if(ctx.dataTypes.length) reasons.push("you mentioned handling " + ctx.dataTypes.join(" and "));
      if(ctx.concerns.indexOf("a cyberattack or data breach") !== -1) reasons.push("a cyberattack or breach came up as a concern");
      if(ctx.businessType === "saas" || ctx.businessType === "ecommerce") reasons.push("digital businesses like yours tend to carry meaningful cyber exposure");
    }
    if(area === "professional"){
      if(ctx.businessType) reasons.push("you're delivering services or advice as a " + ctx.businessType + " business");
      if(ctx.concerns.indexOf("a client dispute or negligence claim") !== -1) reasons.push("client disputes were mentioned as a concern");
    }
    if(area === "business"){
      reasons.push("general business risks like public liability may be worth covering for day-to-day operations");
    }
    if(area === "property"){
      if(ctx.assets.length) reasons.push("you mentioned " + ctx.assets.filter(function(a){return /office|warehouse|equipment/.test(a);}).join(", "));
      if(ctx.concerns.indexOf("fire or property damage") !== -1) reasons.push("fire or property damage came up");
    }
    if(area === "home"){
      reasons.push("your home and its contents may be worth reviewing for buildings and contents cover");
    }
    if(area === "travel"){
      reasons.push("upcoming travel plans can carry risk around cancellation, delay or medical costs abroad");
    }
    if(area === "motor"){
      reasons.push("a vehicle used personally or for business is usually a distinct area of cover");
    }
    if(area === "fineart"){
      reasons.push("standalone collections often exceed what standard home cover is built for");
    }
    if(area === "privateclient"){
      reasons.push("multiple valuable assets are often easier to manage under one broader private client policy");
    }
    if(reasons.length === 0) reasons.push("it came up in what you've shared so far");
    return "May be worth exploring — " + reasons.join("; ") + ".";
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function respondTo(userText){
    ctx.turns++;
    var intent = detectIntent(userText);
    var analysis = { newFacts: [], touchedAreas: [] };
    if(intent !== "greeting") analysis = analyze(userText);

    if(intent === "greeting"){
      return {
        html: "<p>Hello! I'm glad you're here. I'm not going to run you through a form — just tell me, in your own words, what's on your mind. A business you run, your home, an upcoming trip, valuables you want to protect — anything.</p>",
        showRec: false
      };
    }

    if(intent === "thanks"){
      return {
        html: "<p>You're welcome. Happy to keep going if there's more to cover, or let me know if you'd like a summary of what we've discussed so far.</p>",
        showRec: false
      };
    }

    if(intent === "handoff"){
      ctx.handoffOffered = true;
      var html = "<p>Of course — I can help with that. Here's what makes sense based on where we are:</p>";
      html += buildRecommendationHTML();
      return { html: html, showRec: false, skipExtraRec: true };
    }

    if(intent === "cost"){
      var areaForCost = ctx.lastArea || pickExplicitArea(userText) || (confirmedAreas()[0]) || null;
      var costHtml = "<p>I can't give you a figure here — pricing depends on specifics like the type of cover, sums insured, claims history and risk profile, and this demo doesn't calculate real premiums.</p>";
      costHtml += "<p>What I can say is that insurers typically weigh things like the nature of " + esc(subjectPhrase()) + ", the level of cover you'd want, and your claims history. If you'd like an actual number, a specialist can put together a proper quote.</p>";
      return { html: costHtml, showRec:false, offerHandoff:true };
    }

    if(intent === "covq"){
      var area = pickExplicitArea(userText) || ctx.lastArea;
      if(area){
        ctx.lastArea = area;
        var st = ensureAreaState(area);
        if(st.score === 0){ st.score = 1; st.factCount = 1; }
        var q = nextFollowUpFor(area);
        var covHtml = "<p><strong>" + esc(KB[area].name) + "</strong> — " + esc(KB[area].short) + "</p>";
        if(q) covHtml += "<p>" + esc(q) + "</p>";
        else covHtml += "<p>Does that sound like an area worth exploring further for you?</p>";
        return { html: covHtml, showRec:false };
      }
      return { html: "<p>" + esc(pick(generalOpenQuestions())) + "</p>", showRec:false };
    }

    if(intent === "summary"){
      if(totalFactSignals() === 0 && confirmedAreas().length === 0){
        return { html: "<p>We haven't covered much yet, so there isn't a lot to summarise. Tell me a bit about your business or personal situation and I'll build a picture as we go.</p>", showRec:false };
      }
      return { html: "<p>Here's where things stand so far:</p>" + buildRecommendationHTML(), showRec:false, skipExtraRec:true };
    }

    // ---- statement handling (default) ----
    ctx.statementTurns++;
    var newFacts = analysis.newFacts;
    var touched = analysis.touchedAreas;

    // choose primary area for this turn
    var primaryArea = null;
    if(touched.length){
      // prefer an area not yet asked-about / newest signal
      primaryArea = touched.sort(function(a,b){ return ctx.coverage[b].score - ctx.coverage[a].score; })[0];
    } else if(ctx.lastArea){
      primaryArea = ctx.lastArea;
    }

    var htmlParts = [];
    var ack = buildAckSentence(newFacts, touched);

    if(!primaryArea && newFacts.length === 0){
      // nothing recognised at all
      if(NEGATIVE_RE.test(userText.trim()) && ctx.lastArea){
        htmlParts.push("<p>No problem. " + esc(pick(generalOpenQuestions())) + "</p>");
      } else {
        htmlParts.push("<p>" + esc(fallbackResponse()) + "</p>");
      }
      return { html: htmlParts.join(""), showRec:false };
    }

    if(ack) htmlParts.push("<p>" + esc(ack) + "</p>");

    var willShowRec = false;
    var currentAreas = confirmedAreas();
    if(currentAreas.length){
      var snapshotChanged = JSON.stringify(currentAreas.slice().sort()) !== JSON.stringify(ctx.shownAreaSnapshot.slice().sort());
      if(ctx.statementTurns >= 2 && totalFactSignals() >= 3 && snapshotChanged){
        willShowRec = true;
      }
    }

    if(primaryArea){
      ctx.lastArea = primaryArea;
      if(!willShowRec){
        var followUp = nextFollowUpFor(primaryArea);
        if(followUp){
          var intro = touched.indexOf(primaryArea) !== -1 && newFacts.some(function(f){return f==="area: "+primaryArea;})
            ? (KB[primaryArea].name + " may be worth exploring here. ")
            : "";
          htmlParts.push("<p>" + esc(intro) + esc(followUp) + "</p>");
        } else {
          // no more scripted follow-ups for this area; nudge toward recommendation or another topic
          willShowRec = currentAreas.length > 0 && !willShowRec;
          if(!willShowRec){
            htmlParts.push("<p>" + esc("Is there anything else about " + subjectPhrase() + " you'd like to tell me, or shall I pull together what we've covered so far?") + "</p>");
          }
        }
      }
    } else if(!willShowRec){
      htmlParts.push("<p>" + esc(pick(generalOpenQuestions())) + "</p>");
    }

    if(willShowRec){
      ctx.shownAreaSnapshot = currentAreas.slice();
      ctx.recommendationCount++;
      htmlParts.push(buildRecommendationHTML());
    }

    return { html: htmlParts.join(""), showRec:false, skipExtraRec:true };
  }

     RENDERING — messages
  ========================================================== */
  function addUserMessage(text){
    var row = document.createElement("div");
    row.className = "row user";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    chatInner.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator(){
    var row = document.createElement("div");
    row.className = "row bot typing-row";
    row.id = "typingRow";
    row.innerHTML = '<div class="avatar-sm">' + botAvatarSVG() + '</div>' +
      '<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    chatInner.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator(){
    var el = document.getElementById("typingRow");
    if(el) el.remove();
  }

  function addBotMessageStreaming(html, onDone){
    var row = document.createElement("div");
    row.className = "row bot";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    row.innerHTML = '<div class="avatar-sm">' + botAvatarSVG() + '</div>';
    row.appendChild(bubble);
    chatInner.appendChild(row);

    // split into a text-reveal part (paragraphs) and a static-append part (rec card block)
    var temp = document.createElement("div");
    temp.innerHTML = html;
    var nodes = Array.prototype.slice.call(temp.childNodes);

    var idx = 0;
    function revealNext(){
      if(idx >= nodes.length){
        if(onDone) onDone();
        return;
      }
      var node = nodes[idx];
      idx++;
      if(node.nodeType === 1 && node.tagName === "P"){
        streamParagraph(node.textContent, bubble, revealNext);
      } else {
        bubble.appendChild(node.cloneNode(true));
        scrollToBottom();
        setTimeout(revealNext, 120);
      }
    }
    revealNext();
  }

  function streamParagraph(text, container, done){
    var p = document.createElement("p");
    container.appendChild(p);
    var words = text.split(" ");
    var i = 0;
    (function step(){
      if(i >= words.length){ done(); return; }
      p.textContent += (i === 0 ? "" : " ") + words[i];
      i++;
      scrollToBottom();
      setTimeout(step, 16 + Math.random()*22);
    })();
  }

  function sendBotResponse(userText){
    isBotTyping = true;
    sendBtn.disabled = true;
    addTypingIndicator();
    var delay = 550 + Math.random()*550;
    setTimeout(function(){
      removeTypingIndicator();
      var result = respondTo(userText);
      addBotMessageStreaming(result.html, function(){
        isBotTyping = false;
        sendBtn.disabled = false;
        renderSummary();
        attachActionHandlers();
      });
    }, delay);
  }

  /* =========================================================
     ACTIONS (delegated)
  ========================================================== */
  function attachActionHandlers(){
    var buttons = chatInner.querySelectorAll(".action-btn[data-action]:not([data-bound])");
    buttons.forEach(function(btn){
      btn.setAttribute("data-bound","1");
      btn.addEventListener("click", function(){
        var action = btn.getAttribute("data-action");
        if(action === "quote") openQuoteModal();
        else if(action === "explore") openExploreModal();
        else if(action === "speak") openSpeakModal();
      });
    });
  }

  function refNumber(){
    return "HX-" + Math.random().toString(36).slice(2,6).toUpperCase() + "-" + new Date().getFullYear();
  }

  function openModal(html){
    modalCard.innerHTML = '<button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>' + html;
    modalOverlay.classList.add("open");
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  }
  function closeModal(){ modalOverlay.classList.remove("open"); modalCard.innerHTML = ""; }
  modalOverlay.addEventListener("click", function(e){ if(e.target === modalOverlay) closeModal(); });

  function openQuoteModal(){
    var areas = confirmedAreas();
    var html = '<h3>Quote request received</h3><p class="sub">This is a simulated handoff for demo purposes — no real quote has been generated.</p>';
    html += '<div class="ref">Reference ' + refNumber() + '</div>';
    html += '<p style="font-size:13.5px;line-height:1.6;">Here\'s what we\'d pass along to a Hiscox underwriting specialist:</p><ul class="modal-steps">';
    if(ctx.businessType) html += '<li>Business type: ' + esc(ctx.businessType) + '</li>';
    if(ctx.employees) html += '<li>Team size: around ' + esc(ctx.employees) + ' people</li>';
    if(ctx.concerns.length) html += '<li>Key concerns: ' + esc(ctx.concerns.join(", ")) + '</li>';
    if(ctx.dataTypes.length) html += '<li>Data handled: ' + esc(ctx.dataTypes.join(", ")) + '</li>';
    if(ctx.assets.length) html += '<li>Assets mentioned: ' + esc(ctx.assets.join(", ")) + '</li>';
    if(areas.length) html += '<li>Coverage areas to explore: ' + esc(areas.map(function(a){return KB[a].name;}).join(", ")) + '</li>';
    if(!ctx.businessType && !ctx.employees && !ctx.concerns.length && !areas.length){
      html += '<li>General enquiry — no specific details captured yet</li>';
    }
    html += '</ul>';
    html += '<p class="modal-note">In a live product, this would route to a real quoting flow or underwriter, using details you confirm along the way — never a live quote or binding cover in this demo.</p>';
    openModal(html);
  }

  function openExploreModal(){
    var areas = confirmedAreas();
    var relevantSet = {};
    areas.forEach(function(a){ relevantSet[a] = true; });
    var html = '<h3>Explore coverage areas</h3><p class="sub">A quick look across the areas Hiscox covers. Highlighted ones connect to what you\'ve shared.</p>';
    html += '<div class="modal-cov-grid">';
    AREA_ORDER.forEach(function(area){
      var kb = KB[area];
      html += '<div class="modal-cov-item"><div class="n">' + esc(kb.name) + (relevantSet[area] ? ' <span class="badge-relevant">May be relevant to you</span>' : '') + '</div>';
      html += '<div class="d">' + esc(kb.short) + '</div></div>';
    });
    html += '</div>';
    html += '<p class="modal-note">Descriptions are simplified for this demo and don\'t represent binding policy wording, limits or eligibility.</p>';
    openModal(html);
  }

  function openSpeakModal(){
    var html = '<div class="connecting-wrap"><div class="connecting-ring"></div>' +
      '<h3 style="text-align:center;">Connecting you now</h3>' +
      '<p class="sub" style="text-align:center;">Simulating a handoff to a Hiscox specialist…</p></div>';
    openModal(html);
    setTimeout(function(){
      var areas = confirmedAreas();
      var html2 = '<h3>You\'re through</h3><p class="sub">A Commercial Lines Specialist would pick up here in a live environment.</p>';
      html2 += '<div class="ref">Reference ' + refNumber() + '</div>';
      html2 += '<p style="font-size:13.5px;line-height:1.6;">They\'d already see a summary of this conversation' + (areas.length ? (", including interest in " + esc(areas.map(function(a){return KB[a].name;}).join(", "))) : "") + '.</p>';
      html2 += '<p class="modal-note">This is a simulated handoff for demo purposes only — no call or chat has actually been placed.</p>';
      modalCard.innerHTML = '<button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>' + html2;
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    }, 1500);
  }

  /* =========================================================
     SUMMARY PANEL
  ========================================================== */
  function renderSummary(){
    var html = "";

    // about
    html += '<div class="sblock"><div class="sblock-title">About</div>';
    var aboutLines = [];
    if(ctx.businessType) aboutLines.push("Business type: " + esc(ctx.businessType));
    else if(ctx.isBusinessSignal) aboutLines.push("Context: a business");
    if(ctx.isPersonalSignal) aboutLines.push("Context: personal / individual");
    if(ctx.employees) aboutLines.push("Team size: ~" + esc(ctx.employees) + " people");
    if(aboutLines.length){
      aboutLines.forEach(function(l){ html += '<div class="fact-line"><span class="dot"></span><span>' + l + '</span></div>'; });
    } else {
      html += '<div class="sblock-empty">Nothing yet — tell Ava a bit about your situation.</div>';
    }
    html += '</div>';

    // risks
    html += '<div class="sblock"><div class="sblock-title">Risks & concerns</div>';
    if(ctx.concerns.length){
      ctx.concerns.forEach(function(c){ html += '<div class="fact-line"><span class="dot"></span><span>' + esc(riskLabelFor(c)) + '</span></div>'; });
    } else {
      html += '<div class="sblock-empty">No specific risks identified yet.</div>';
    }
    html += '</div>';

    // data & assets
    var dataAssets = ctx.dataTypes.concat(ctx.assets);
    html += '<div class="sblock"><div class="sblock-title">Data & assets mentioned</div>';
    if(dataAssets.length){
      dataAssets.forEach(function(d){ html += '<div class="fact-line"><span class="dot"></span><span>' + esc(d.charAt(0).toUpperCase()+d.slice(1)) + '</span></div>'; });
    } else {
      html += '<div class="sblock-empty">Nothing captured yet.</div>';
    }
    html += '</div>';

    // coverage areas
    var areas = confirmedAreas();
    html += '<div class="sblock"><div class="sblock-title">Coverage worth exploring</div>';
    if(areas.length){
      areas.forEach(function(a){
        html += '<div class="area-card"><div class="name">' + esc(KB[a].name) + '</div><div class="status">Worth exploring</div></div>';
      });
    } else {
      html += '<div class="sblock-empty">Areas will appear here as they come up in conversation.</div>';
    }
    html += '</div>';

    summaryBody.innerHTML = html;
  }

  /* =========================================================
     INPUT HANDLING
  ========================================================== */
  function handleSend(){
    var text = userInput.value.trim();
    if(!text || isBotTyping) return;
    addUserMessage(text);
    userInput.value = "";
    autoGrow();
    sendBotResponse(text);
  }

  function autoGrow(){
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + "px";
  }

  sendBtn.addEventListener("click", handleSend);
  userInput.addEventListener("input", autoGrow);
  userInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });

  document.getElementById("newConvoBtn").addEventListener("click", function(){
    chatInner.innerHTML = "";
    ctx = freshContext();
    renderSummary();
    startConversation();
  });

  document.getElementById("toggleSummaryBtn").addEventListener("click", function(){
    summaryCol.classList.toggle("open");
  });

  /* =========================================================
     INIT
  ========================================================== */
  function startConversation(){
    isBotTyping = true;
    sendBtn.disabled = true;
    addTypingIndicator();
    setTimeout(function(){
      removeTypingIndicator();
      addBotMessageStreaming(
        "<p>Hello, I'm Ava — Hiscox's virtual insurance advisor.</p><p>There's no form to fill in here. Just tell me, in your own words, what's going on — a business you run, your home, an upcoming trip, valuables you want to protect, or a specific worry on your mind — and I'll help you think through it from there.</p>",
        function(){ isBotTyping = false; sendBtn.disabled = false; renderSummary(); }
      );
    }, 500);
  }

  renderSummary();
  startConversation();
})();
</script>
</body>
</html>
